name: Benchmark

# Pull requests are compared against the commit they merge into, inside one
# job, so both builds share a runner. Only master is recorded on the dashboard:
# absolute scores from different runners are not comparable, and recording
# pull requests mixed unmerged code into the history that master is judged by.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the running comparison. Master runs
# are keyed by commit instead, so that each merge is recorded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job starts from a read-only token. The comparison is posted by the
# comment job below for pull requests from this repository, and by
# benchmark-comment.yml for forks, whose runs cannot be granted more. Only the
# master job that publishes the dashboard receives RV32EMU_BENCH_TOKEN.
permissions:
  contents: read

jobs:
  # Resolved in its own job so the benchmark carries a single condition rather
  # than repeating it on every step.
  detect-file-changes:
    runs-on: ubuntu-24.04
    outputs:
      has_changed_files: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Test changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
              src/**
              configs/**
              Makefile
              mk/**
              tools/detect-env.py
              tests/bench.py
              .github/workflows/benchmark.yml

  # A pull request is compared against the commit it merges into; any other
  # event records absolute scores for the dashboard.
  bench:
    name: Benchmark (${{ matrix.mode }})
    needs: [detect-file-changes]
    if: needs.detect-file-changes.outputs.has_changed_files == 'true' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The interpreter keeps its unlabeled series names, which carry the
          # dashboard history recorded before the JIT modes were added. It runs
          # Dhrystone for about three minutes a pair, which bounds the job.
          - mode: interpreter
            label: ''
            defconfig: defconfig
            flags: ''
            llvm: 'false'
            parallel: 2
          - mode: T1C
            label: T1C
            defconfig: jit_defconfig
            flags: ENABLE_T2C=0
            llvm: 'false'
            parallel: 2
          # Each T2C emulator also runs an LLVM compile thread, so its pairs
          # take the runner's four CPUs one benchmark at a time.
          - mode: T2C
            label: T2C
            defconfig: jit_defconfig
            flags: ENABLE_T2C=1
            llvm: 'true'
            parallel: 1
    env:
      # Raises the anonymous-API rate limit (60 req/hr) used by the parse-time
      # call to fetch-releases-tag.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMPARE: ${{ github.event_name == 'pull_request' }}
    steps:
      # The pull_request ref is the merge of the branch into master, so its
      # first parent is exactly the code the change would land on.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: 'true'

      - name: Check out baseline
        if: env.COMPARE == 'true'
        run: |
            git worktree add --detach baseline HEAD^1
            # Building needs only the sources under src/, not the test suites.
            git -C baseline config --file .gitmodules --get-regexp '\.path$' \
                | awk '$2 ~ /^src\// { print $2 }' \
                | xargs git -C baseline submodule update --init --

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          llvm: ${{ matrix.llvm }}
          artifacts: elf
          cache-suffix: bench-${{ matrix.mode }}

      # Both trees run the same configuration commands, each reading its own
      # defconfig files, so a change to those files is part of what is measured.
      - name: Build
        run: |
            trees=(.)
            [ "${COMPARE}" = true ] && trees+=(baseline)
            for tree in "${trees[@]}"; do
              make -C "${tree}" cleanconfig
              make -C "${tree}" ${{ matrix.defconfig }}
              make -C "${tree}" ENABLE_SDL=0 ${{ matrix.flags }} "${PARALLEL}"
              if [ "${{ matrix.mode }}" = "T2C" ] && [ ! -f "${tree}/build/t2c.o" ]; then
                echo "ERROR: T2C disabled in ${tree} (build/t2c.o missing)"
                exit 1
              fi
            done

      - name: Compare with baseline
        if: env.COMPARE == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
            # Dhrystone and CoreMark each run as a pair; with parallel 2, both
            # pairs at once on the runner's four CPUs.
            # Name both sides, so the table cannot be mistaken for a
            # comparison with an earlier push of the same pull request.
            BASE_SHA=$(git rev-parse HEAD^1)
            python3 tests/bench.py --quiet --runs 6 \
                --parallel ${{ matrix.parallel }} --max-seconds 900 \
                --label ${{ matrix.mode }} \
                --emu build/rv32emu --baseline baseline/build/rv32emu \
                --baseline-name "Previous: ${BASE_REF} ${BASE_SHA:0:7}" \
                --candidate-name "Current: ${HEAD_SHA:0:7}" \
                --markdown "compare-${{ matrix.mode }}.md" \
                --json "compare-${{ matrix.mode }}.json"
            printf '\nCurrent: %s merged into %s. Previous: %s at %s.\n' \
                "${HEAD_SHA}" "${BASE_REF}" "${BASE_REF}" "${BASE_SHA}" \
                >> "compare-${{ matrix.mode }}.md"
            cat "compare-${{ matrix.mode }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Record
        if: env.COMPARE != 'true'
        run: |
            python3 tests/bench.py --quiet --label "${{ matrix.label }}" \
                --json "bench-${{ matrix.mode }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ env.COMPARE == 'true' && 'compare' || 'record' }}-${{ matrix.mode }}
          path: |
            compare-${{ matrix.mode }}.*
            bench-${{ matrix.mode }}.json
          if-no-files-found: error
          retention-days: 7

  # A pull request from this repository can be granted a token that comments,
  # so it gets its tables without waiting for benchmark-comment.yml, which
  # runs master's copy and so does not exist until this workflow is merged.
  comment:
    name: Post comparison
    needs: [bench]
    if: >-
      !cancelled() && needs.bench.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    # Two quick pushes finish in either order; posting one at a time keeps a
    # single comment instead of racing to create two.
    concurrency:
      group: ${{ github.workflow }}-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .ci

      - uses: actions/download-artifact@v8
        with:
          pattern: bench-compare-*
          merge-multiple: true

      - name: Post comparison
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CONCLUSION: ${{ needs.bench.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .ci/benchmark-comment.sh

  # Only master reaches the dashboard, even when dispatched manually from another
  # branch. A mode that failed to record does not hold back the others, but a
  # push that skipped recording altogether publishes nothing.
  publish:
    name: Publish to dashboard
    needs: [bench]
    if: ${{ !cancelled() && needs.bench.result != 'skipped' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    # Serializes pushes to the dashboard repository across master commits.
    concurrency:
      group: benchmark-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-record-*
          merge-multiple: true

      - name: Merge results
        run: |
            shopt -s nullglob
            present=(bench-*.json)
            [ "${#present[@]}" -gt 0 ] || { echo "No mode recorded a result"; exit 1; }
            jq -s 'add' "${present[@]}" > benchmark_output.json

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Benchmarks
          tool: 'customBiggerIsBetter'
          output-file-path: benchmark_output.json
          github-token: ${{ secrets.RV32EMU_BENCH_TOKEN }}
          gh-repository: 'github.com/sysprog21/rv32emu-bench'
          gh-pages-branch: 'master'
          auto-push: true
          benchmark-data-dir-path: .
