name: Build Linux artifact

on:
  workflow_call:
    inputs:
      toolchain-artifact:
        description: >
          Which Buildroot toolchain builds the Linux image. true: the one just
          rebuilt in this workflow run (buildroot-toolchain-prebuilt artifact).
          false: the latest one published to rv32emu-prebuilt.
        type: boolean
        default: false
    outputs:
      built:
        value: ${{ jobs.detect-file-change.outputs.has_changed_linux_image_version }}
  workflow_dispatch:

concurrency:
  group: build-linux-artifact-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-file-change:
    runs-on: ubuntu-24.04
    outputs:
      has_changed_linux_image_version: ${{ steps.has_changed_files.outputs.has_changed_linux_image_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Test file change of Linux image
        id: test-linux-image-version-change
        uses: tj-actions/changed-files@v47
        with:
          files: |
            assets/system/configs/*
            tools/build-linux-image.sh
            mk/external.mk
            tests/system/br_pkgs/rtc/*.c
      - name: Set alias
        id: has_changed_files
        env:
          ANY_MODIFIED: ${{ steps.test-linux-image-version-change.outputs.any_modified }}
          CHANGED_FILES: ${{ steps.test-linux-image-version-change.outputs.all_changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOOLCHAIN_ARTIFACT: ${{ inputs.toolchain-artifact }}
        run: |
          # A new toolchain always needs a new image built with it.
          if [ "$TOOLCHAIN_ARTIFACT" = "true" ]; then
            echo "has_changed_linux_image_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ANY_MODIFIED" != "true" ]; then
            echo "has_changed_linux_image_version=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for file in $CHANGED_FILES; do
            if [ "$file" != "mk/external.mk" ]; then
              echo "has_changed_linux_image_version=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="HEAD^"
          fi
          if git --no-pager diff "$base" HEAD -- mk/external.mk | \
             grep -qE '^[+-][A-Z0-9_]+_(VERSION|PATCHLEVEL)\b'; then
            echo "has_changed_linux_image_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_linux_image_version=false" >> "$GITHUB_OUTPUT"
          fi

  build-linux-image-artifact:
    needs: [detect-file-change]
    if: ${{ needs.detect-file-change.outputs.has_changed_linux_image_version == 'true' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 120  # a full Buildroot run from scratch
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install dependencies
        run: .ci/apt-install.sh build-essential bison flex git
      - name: Download Buildroot toolchain from workflow run
        if: inputs.toolchain-artifact
        uses: actions/download-artifact@v7
        with:
          name: buildroot-toolchain-prebuilt
          path: /tmp/buildroot-toolchain-prebuilt
      - name: Export workflow Buildroot toolchain URL
        if: inputs.toolchain-artifact
        run: echo "BUILDROOT_TOOLCHAIN_URL=file:///tmp/buildroot-toolchain-prebuilt/riscv32-buildroot-linux-gnu_sdk-buildroot.tar.gz" >> "$GITHUB_ENV"
      - name: Build Linux image
        env:
          # Lets tools/build-linux-image.sh look up the published toolchain
          # without hitting the anonymous API rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make build-linux-image
          make system_defconfig
          make artifact ENABLE_PREBUILT=0
      - name: Create tarball
        run: tar -zcf /tmp/rv32emu-linux-image-prebuilt.tar.gz -C /tmp rv32emu-linux-image-prebuilt
      - name: Upload Linux image artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-image-prebuilt
          path: |
            /tmp/rv32emu-linux-image-prebuilt.tar.gz
            /tmp/sha1sum-linux-image

  publish-linux-image-artifact:
    needs: [build-linux-image-artifact]
    if: >-
      github.repository == 'sysprog21/rv32emu' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Linux image artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-image-prebuilt
          path: /tmp
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RV32EMU_PREBUILT_TOKEN }}
        working-directory: /tmp
        run: |
          ${{ github.workspace }}/.ci/publish-prebuilt.sh Linux-Image \
            rv32emu-linux-image-prebuilt.tar.gz sha1sum-linux-image
