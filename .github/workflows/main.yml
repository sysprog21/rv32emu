name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-code-related-file-changes:
    runs-on: ubuntu-24.04
    outputs:
      has_code_related_changes: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Test changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
              .ci/**
              assets/**
              .github/actions/**
              .github/workflows/**
              build/**
              configs/**
              mk/**
              scripts/**
              src/**
              tests/**
              tools/**
              .clang-format
              Dockerfile
              Makefile

  build-linux-image:
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    uses: ./.github/workflows/build-linux-artifacts.yml
    secrets: inherit

  # Emscripten output is platform independent, so it is built once on x64
  # rather than in every host matrix leg.
  wasm-build:
    name: emcc build
    needs: [detect-code-related-file-changes, build-linux-image]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          llvm: 'false'
          linux-image-artifact: ${{ needs.build-linux-image.outputs.built == 'true' }}
          # No artifact prefetch: the build steps below open with "make
          # distclean", which would throw away anything downloaded here.

      - name: Set up emsdk
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.51
          actions-cache-folder: 'emsdk-cache'

      - name: Install browser smoke test dependencies
        run: |
              .ci/apt-install.sh cpio
              python3 -m pip install --break-system-packages playwright==1.63.0
              python3 -m playwright install --with-deps chromium

      # Note: wasm_defconfig sets CONFIG_BUILD_WASM=y which auto-selects CC=emcc
      - name: Build user emulation
        run: |
              make distclean
              make wasm_defconfig
              .ci/emsdk-warm-cache.sh
              make $PARALLEL
              make check-jit-wasm
              make prepare-web
              python3 tests/test-wasm-demo.py --mode user --expect-jit

      - name: Build system emulation
        run: |
              make distclean
              make wasm_system_defconfig
              make $PARALLEL
              make prepare-web
              python3 tests/test-wasm-demo.py --mode system --expect-jit

      # The html mode of tools/deploy-webui.sh must render the same pages as
      # the system prepare-web above. The distclean in that step removed
      # demo/user, so only the pages it rebuilt are compared.
      - name: Check HTML-only deployment
        run: |
              make check-deploy-webui
              ref="$RUNNER_TEMP/demo-ref"
              mkdir -p "$ref/system"
              for f in index.html system/index.html; do
                cp "demo/$f" "$ref/$f"
              done
              tools/deploy-webui.sh html
              for f in index.html system/index.html; do
                cmp "$ref/$f" "demo/$f"
              done

  host-x64:
    name: x64 ${{ matrix.compiler }}
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      id: setup
      uses: ./.github/actions/setup-build
      with:
        compiler: ${{ matrix.compiler }}
        riscv-toolchain: 'true'
        artifacts: elf linux-image doom
        cache-suffix: host-${{ matrix.compiler }}

    - name: Build with various optimization levels
      run: |
            .ci/build-opt-levels.sh defconfig
            .ci/build-opt-levels.sh interpreter_defconfig

    - name: Build system emulation with various optimization levels
      run: |
            .ci/build-opt-levels.sh system_defconfig
            .ci/build-opt-levels.sh system_interpreter_defconfig

    - name: check + tests
      run: |
            make cleanconfig
            make interpreter_defconfig
            make check $PARALLEL
            make tests $PARALLEL
            make misalign $PARALLEL
            make tool $PARALLEL
            make -C tests/sound check-mixer

    - name: SDL disable test
      run: |
            # SDL is the graphics subsystem; an interpreter-only test suffices.
            make distclean && make interpreter_defconfig && make ENABLE_SDL=0 check $PARALLEL

    - name: misalignment test in block emulation
      run: |
            make -C tests/system/alignment/
            make distclean && make system_interpreter_defconfig && make ENABLE_ELF_LOADER=1 ENABLE_EXT_C=0 misalign-in-blk-emu $PARALLEL

    - name: JIT blocked-opcode diagnostics
      run: |
            make defconfig
            # Zba under register pressure must also run compiled, not just correctly.
            make OUT=build/blocker-stats T1C_STATS=1 check-jit-blocker-stats check-jit-blocker-stats-load check-jit-blocker-stats-store check-jit-spill-loop-zba check-jit-spill-loop-region-zba $PARALLEL

    - name: MMU test
      run: |
            make -C tests/system/mmu/
            make distclean && make system_interpreter_defconfig && make ENABLE_ELF_LOADER=1 mmu-test $PARALLEL
            # Page faults a loaded program cannot handle: the emulator stops
            # at one on a fetch, and skips exactly the faulting access.
            make distclean && make system_defconfig && make ENABLE_ELF_LOADER=1 mmu-test check-insn-page-fault check-misalign-page-fault check-fused-page-fault check-amo-page-fault $PARALLEL
            # Flat supervisor kernels: TLB caching, superpage flushes, address
            # space switches, retiring decoded code, counters across traps,
            # fault retry, code eviction and timer interrupts returning into
            # chained loops, interpreted and T1.
            make distclean && make system_interpreter_defconfig && make ENABLE_ROOTFS_EXT4=0 check-system-mmu-cache check-system-trap-cycles check-system-trap-resume check-system-jit-eviction check-system-interrupt-dispatch check-system-priv check-system-misalign-page $PARALLEL
            make distclean && make system_defconfig && make ENABLE_ROOTFS_EXT4=0 check-system-mmu-cache check-system-trap-cycles check-system-trap-resume check-system-jit-eviction check-system-interrupt-dispatch check-system-priv check-system-misalign-page $PARALLEL
            # Prove fetch retries, in place inside nested handlers too, and
            # restored native eligibility, while the unsupported CSR payload
            # still falls back to interpretation, and that Sv32 Zba probes run
            # compiled rather than interpreted.
            make OUT=build/system-stats T1C_STATS=1 ENABLE_ROOTFS_EXT4=0 check-system-fetch-retry check-system-fetch-retry-nested check-system-zba check-system-amo check-system-csr $PARALLEL

    - name: gdbstub test
      run: make distclean && make interpreter_defconfig && make ENABLE_GDBSTUB=1 gdbstub-test $PARALLEL

    - name: JIT base test
      run: |
            # defconfig is the tier-1 JIT alone; jit_defconfig adds T2C.
            make distclean && make defconfig && make check $PARALLEL
            # Register shifts without BMI2, as on older x86-64 CPUs.
            make JIT_DISABLE_BMI2=1 check $PARALLEL
            make cleanconfig && make jit_defconfig && make check $PARALLEL

    - name: undefined behavior test
      if: success() || failure()
      run: |
            make distclean && make interpreter_defconfig && make ENABLE_UBSAN=1 check $PARALLEL
            make distclean && make jit_defconfig && make ENABLE_UBSAN=1 check $PARALLEL

  # Each optional feature is independently switchable, so every one of them is
  # built with the knob off. Split across runners because the serial run of all
  # 24 builds dominated the job it used to live in.
  host-x64-feature-disable:
    name: x64 ${{ matrix.compiler }} feature disable (${{ matrix.group }})
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        group: [core, bitmanip-perf]   # .ci/test-ext-disable.sh owns the members
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      id: setup
      uses: ./.github/actions/setup-build
      with:
        compiler: ${{ matrix.compiler }}
        riscv-toolchain: 'true'
        artifacts: elf
        cache-suffix: feature-${{ matrix.compiler }}-${{ matrix.group }}

    - name: Feature disable tests (interpreter + JIT)
      run: .ci/test-ext-disable.sh ${{ matrix.group }}

  # The architecture test is compiler agnostic: it validates the emulator
  # against the Sail model, so a second host compiler adds runtime, not
  # coverage. It is x64 only, since the macOS runners are the scarcest
  # resource in this workflow and provide nothing the Linux run does not.
  arch-test-x64:
    name: RISC-V architecture test
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      id: setup
      uses: ./.github/actions/setup-build
      with:
        compiler: gcc
        llvm: 'true'
        arch-test: 'true'
        # ACT4 downloads its required Sail version directly.

    - name: Architecture test
      run: .ci/riscv-tests.sh

    - name: Upload ACT4 results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: act4-results
        path: |
          build/arch-test/results/
          build/arch-test/*/test_list.md
          build/arch-test/*/extensions.txt

  # Boot tests are the long pole of the workflow, so each configuration gets
  # its own runner. AOT has a separate LLVM compatibility and Linux boot matrix.
  boot-tests-x64:
    name: x64 ${{ matrix.compiler }} boot (${{ matrix.boot_type }})
    needs: [detect-code-related-file-changes, build-linux-image]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            boot_type: interpreter
            defconfig: system_interpreter_defconfig
            make_flags: ""
            timeout: 60
          - compiler: gcc
            boot_type: jit
            defconfig: system_defconfig
            make_flags: "ENABLE_MOP_FUSION=0"
            timeout: 120
          - compiler: clang
            boot_type: interpreter
            defconfig: system_interpreter_defconfig
            make_flags: ""
            timeout: 60
          - compiler: clang
            boot_type: jit
            defconfig: system_defconfig
            make_flags: "ENABLE_MOP_FUSION=0"
            timeout: 120
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      id: setup
      uses: ./.github/actions/setup-build
      with:
        compiler: ${{ matrix.compiler }}
        llvm: ${{ matrix.compiler == 'clang' }}
        linux-image-artifact: ${{ needs.build-linux-image.outputs.built == 'true' }}
        cache-suffix: boot-${{ matrix.compiler }}-${{ matrix.boot_type }}

    - name: boot Linux kernel test (ext4 rootfs) (${{ matrix.boot_type }})
      env:
        BOOT_TIMEOUT: ${{ matrix.timeout }}
      run: |
            make distclean && make ${{ matrix.defconfig }} && make INITRD_SIZE=32 ${{ matrix.make_flags }} $PARALLEL && make artifact $PARALLEL
            .ci/boot-linux-test.sh
    - name: boot Linux kernel test (initrd rootfs) (${{ matrix.boot_type }})
      # Run even when the ext4 boot failed, so one rootfs does not hide the other.
      if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
      env:
        BOOT_TIMEOUT: ${{ matrix.timeout }}
      run: |
            make distclean && make ${{ matrix.defconfig }} && make ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32 ${{ matrix.make_flags }} $PARALLEL && make artifact $PARALLEL
            .ci/boot-linux-test.sh "initrd"

  # A guest reboot abandons the hart coroutine stack and restarts it. Run the
  # reboot tests under AddressSanitizer, which checks the stack-switch
  # annotations, and on the ucontext backend, which x86-64 never selects.
  coroutine-x64:
    name: x64 hart coroutine (${{ matrix.variant }})
    needs: [detect-code-related-file-changes, build-linux-image]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asan
            compiler: clang
            cflags: "-fsanitize=address -fno-omit-frame-pointer"
          - variant: ucontext
            compiler: gcc
            cflags: "-DCORO_USE_UCONTEXT"
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      uses: ./.github/actions/setup-build
      with:
        compiler: ${{ matrix.compiler }}
        llvm: 'false'
        artifacts: linux-image
        linux-image-artifact: ${{ needs.build-linux-image.outputs.built == 'true' }}
        cache-suffix: coroutine-${{ matrix.variant }}

    - name: reboot test (${{ matrix.variant }})
      env:
        BOOT_TIMEOUT: 300
        ASAN_OPTIONS: detect_leaks=0:detect_stack_use_after_return=1
      run: |
            # Every make call gets the same flags, so nothing is rebuilt
            # without them.
            flags=(CC="$CC ${{ matrix.cflags }}" INITRD_SIZE=32 ENABLE_MOP_FUSION=0)
            make distclean && make system_defconfig
            make "${flags[@]}" $PARALLEL && make "${flags[@]}" artifact $PARALLEL
            .ci/reboot.sh

  # Native AArch64 on GitHub ARM runners - fast, no QEMU overhead
  # FIXME: gcc build fails on AArch64/Linux hosts, hence clang only
  host-arm64:
    name: arm64 clang
    needs: [detect-code-related-file-changes, build-linux-image]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Set up build environment
      id: setup
      uses: ./.github/actions/setup-build
      with:
        # Plain "clang" resolves through the LLVM bin directory this action
        # prepends to PATH, so it is the pinned LLVM, not the distro's.
        cc: clang
        artifacts: elf linux-image
        linux-image-artifact: ${{ needs.build-linux-image.outputs.built == 'true' }}
        cache-suffix: host

    - name: check + tests
      run: |
            make cleanconfig
            make interpreter_defconfig
            make check $PARALLEL

    - name: JIT tests
      run: |
            set -euo pipefail
            make distclean && make defconfig && make check $PARALLEL
            make cleanconfig && make jit_defconfig && make check $PARALLEL
            for ext in ENABLE_EXT_A ENABLE_EXT_F ENABLE_EXT_C; do
              echo "JIT test with ${ext}=0"
              make ENABLE_JIT=1 clean && make ${ext}=0 ENABLE_JIT=1 check $PARALLEL
            done

    - name: boot Linux kernel test (ext4 rootfs) (T1C)
      env:
        BOOT_TIMEOUT: 120
      run: |
            make distclean && make system_jit_defconfig && make INITRD_SIZE=32 ENABLE_MOP_FUSION=0 $PARALLEL && make artifact $PARALLEL
            .ci/boot-linux-test.sh

    - name: boot Linux kernel test (initrd rootfs) (T1C)
      env:
        BOOT_TIMEOUT: 120
      run: |
            make distclean && make system_jit_defconfig && make ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32 ENABLE_MOP_FUSION=0 $PARALLEL && make artifact $PARALLEL
            .ci/boot-linux-test.sh "initrd"

  macOS-arm64:
    name: macOS ${{ matrix.compiler }}
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-15, clang]
    runs-on: macos-latest # M1 chip
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
     - uses: actions/checkout@v7
       with:
         submodules: 'true'

     - name: Set up build environment
       id: setup
       uses: ./.github/actions/setup-build
       with:
         compiler: ${{ matrix.compiler }}
         riscv-toolchain: 'true'
         artifacts: elf doom
         cache-suffix: host-${{ matrix.compiler }}

     - name: check + tests
       run: |
             make cleanconfig
             make interpreter_defconfig
             make check $PARALLEL
             make tests $PARALLEL
             make misalign $PARALLEL
             make tool $PARALLEL

     - name: SDL disable test
       run: |
             # SDL is the graphics subsystem; an interpreter-only test suffices.
             make distclean && make interpreter_defconfig && make ENABLE_SDL=0 check $PARALLEL

     - name: gdbstub test, need RV32 toolchain
       run: make distclean && make interpreter_defconfig && make ENABLE_GDBSTUB=1 gdbstub-test $PARALLEL

     - name: JIT base test
       run: |
             # defconfig is the tier-1 JIT alone; jit_defconfig adds T2C.
             make distclean && make defconfig && make check $PARALLEL
             make cleanconfig && make jit_defconfig && make check $PARALLEL

     - name: undefined behavior test
       # gcc on macOS/arm64 does not support sanitizers
       if: (success() || failure()) && matrix.compiler == 'clang'
       run: |
             make distclean && make interpreter_defconfig && make ENABLE_UBSAN=1 check $PARALLEL
             make distclean && make jit_defconfig && make ENABLE_UBSAN=1 check $PARALLEL

  boot-tests-macos-arm64:
    name: macOS ${{ matrix.compiler }} boot (${{ matrix.boot_type }})
    needs: [detect-code-related-file-changes, build-linux-image]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-15, clang]
        boot_type: [interpreter, jit]
        include:
          - boot_type: interpreter
            defconfig: system_interpreter_defconfig
            timeout: 50
          - boot_type: jit
            defconfig: system_defconfig
            make_flags: ENABLE_MOP_FUSION=0
            timeout: 180  # JIT under macOS load has flaked at 90s
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
     - uses: actions/checkout@v7
       with:
         submodules: "true"

     - name: Set up build environment
       id: setup
       uses: ./.github/actions/setup-build
       with:
         compiler: ${{ matrix.compiler }}
         linux-image-artifact: ${{ needs.build-linux-image.outputs.built == 'true' }}
         cache-suffix: boot-macos-${{ matrix.compiler }}-${{ matrix.boot_type }}

     - name: boot Linux kernel test (ext4 rootfs) (${{ matrix.boot_type }})
       env:
         BOOT_TIMEOUT: ${{ matrix.timeout }}
       run: |
             make distclean && make ${{ matrix.defconfig }} && make INITRD_SIZE=32 ${{ matrix.make_flags }} $PARALLEL && make artifact $PARALLEL
             .ci/boot-linux-test.sh

     - name: boot Linux kernel test (initrd rootfs) (${{ matrix.boot_type }})
       # Run even when the ext4 boot failed, so one rootfs does not hide the other.
       if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
       env:
         BOOT_TIMEOUT: ${{ matrix.timeout }}
       run: |
             make distclean && make ${{ matrix.defconfig }} && make ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32 ${{ matrix.make_flags }} $PARALLEL && make artifact $PARALLEL
             .ci/boot-linux-test.sh "initrd"

  publish-linux-image:
    needs:
      - build-linux-image
      - boot-tests-x64
    if: >-
      github.repository == 'sysprog21/rv32emu' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.build-linux-image.outputs.built == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download Linux image artifact
        uses: actions/download-artifact@v7
        with:
          name: linux-image-prebuilt
          path: /tmp
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RV32EMU_PREBUILT_TOKEN }}
        working-directory: /tmp
        run: |
          ${{ github.workspace }}/.ci/publish-prebuilt.sh Linux-Image \
            rv32emu-linux-image-prebuilt.tar.gz sha1sum-linux-image

  macOS-arm64-feature-disable:
    name: macOS ${{ matrix.compiler }} feature disable
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-15, clang]
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
     - uses: actions/checkout@v7
       with:
         submodules: 'true'

     - name: Set up build environment
       id: setup
       uses: ./.github/actions/setup-build
       with:
         compiler: ${{ matrix.compiler }}
         riscv-toolchain: 'true'
         artifacts: elf
         cache-suffix: feature-${{ matrix.compiler }}

     - name: Feature disable tests (interpreter + JIT)
       run: .ci/test-ext-disable.sh

  coding-style:
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install formatters
      run: .ci/install-formatters.sh
    - name: coding convention
      run: |
            .ci/check-newline.sh
            .ci/check-format.sh
    # src/decode.c is generated from src/instructions.in but committed, so
    # the two can drift apart.  Regenerate and diff against the tree; this
    # job already has the pinned clang-format installed.  check-decoder
    # reads only the descriptor and the scripts, so it needs no .config
    # and does not pull in the Kconfiglib clone.
    - name: decoder matches ISA descriptor
      run: make check-decoder

  llvm-c-aot:
    env:
      LLVM_CONFIG: /usr/lib/llvm-${{ matrix.llvm }}/bin/llvm-config
      # Six concurrent runners fetch release artifacts; authenticate the API.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        llvm: [19, 20, 21, 22, 23]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: ./.github/actions/setup-build
        with:
          cc: gcc
          llvm-version: ${{ matrix.llvm }}
          riscv-toolchain: 'true'
          artifacts: 'elf linux-image'
          cache-suffix: aot-llvm-${{ matrix.llvm }}
      - name: Read the default LLVM version
        id: default-llvm
        run: echo "version=$(cat .ci/llvm-version)" >> "$GITHUB_OUTPUT"
      # cleanconfig keeps the fetched artifacts but drops objects and their
      # dependency files, which another configuration (the artifact fetch, or
      # the previous step) left behind.
      - name: Check user AOT
        run: |
          make cleanconfig
          make jit_defconfig
          make -j4 ENABLE_SDL=0
          make ENABLE_SDL=0 check-aot
      # Every LLVM version must build and run the AOT suites; native PGO and
      # the full Linux collection, compilation, and timed boot run on the
      # default. The user build above serves the PGO suite, and the Linux boot
      # needs the system build below, so the order matters.
      - name: Check user AOT with native PGO
        if: matrix.llvm == steps.default-llvm.outputs.version
        run: make ENABLE_SDL=0 AOT_TEST_FLAGS=--native-pgo check-aot
      - name: Check system AOT and precise traps
        run: |
          make cleanconfig
          make system_jit_defconfig
          make -j4 ENABLE_SDL=0 ENABLE_VIRTIO_NET=0 ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32
          make ENABLE_SDL=0 ENABLE_VIRTIO_NET=0 ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32 check-system-aot
          # Unit tests that only build with system T2C, such as mmu-code and
          # aot-lookup, run in no other lane.
          make ENABLE_SDL=0 ENABLE_VIRTIO_NET=0 ENABLE_ROOTFS_EXT4=0 INITRD_SIZE=32 tests
      - name: Collect, compile, and boot Linux with AOT
        if: matrix.llvm == steps.default-llvm.outputs.version
        run: |
          python3 .ci/boot-aot.py --emulator build/rv32emu \
            --llvm-config /usr/lib/llvm-${{ matrix.llvm }}/bin/llvm-config \
            --output build/linux-aot-results --runs 3 --min-speedup 0
      - uses: actions/upload-artifact@v7
        if: always() && matrix.llvm == steps.default-llvm.outputs.version
        with:
          name: linux-aot-llvm-${{ matrix.llvm }}
          path: |
            build/linux-aot-results/*.log
            build/linux-aot-results/results.json

  static-analysis:
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'true'

    # scan-build lives in clang-tools-<N>, and the analyzer resolves the
    # versioned clang-<N>/scan-build-<N> names from /usr/bin. Those are apt
    # symlinks outside /usr/lib/llvm-<N>, so the LLVM cache the other jobs use
    # would restore the tree without the names this job calls: install fresh.
    - name: Set up scan-build
      run: |
            LLVM_VERSION=$(cat .ci/llvm-version)
            .ci/apt-install.sh curl wget lsb-release gnupg libsdl2-dev libsdl2-mixer-dev
            sudo .ci/install-llvm.sh "${LLVM_VERSION}"
            .ci/apt-retry.sh install -y -q=2 "clang-${LLVM_VERSION}" "clang-tools-${LLVM_VERSION}"

    - name: Run scan-build
      run: .ci/scan-build.sh

  # https://docs.docker.com/build/ci/github-actions/multi-platform/
  docker-hub-build-and-publish:
    needs: [detect-code-related-file-changes]
    if: needs.detect-code-related-file-changes.outputs.has_code_related_changes == 'true'
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: >-
          github.event_name == 'push' &&
          github.repository == 'sysprog21/rv32emu' &&
          github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Get short commit SHA1
        run: echo "short_hash=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' && github.repository == 'sysprog21/rv32emu' && github.ref == 'refs/heads/master' }}
          context: .
          platforms: linux/amd64,linux/arm64/v8
          tags: sysprog21/rv32emu:latest, sysprog21/rv32emu:${{ env.short_hash }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
